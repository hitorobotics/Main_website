<div class="mono rise" style="display: flex; align-items: center; gap: 14px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #545B63"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle class="ping" cx="8" cy="8" r="3" style="fill: none; stroke: var(--signal); stroke-width: 1"></circle><circle cx="8" cy="8" r="3" style="fill: var(--signal)"></circle></svg>Privacy</div>
<h1 style="margin-top: 28px; font-size: clamp(40px, 4.4vw, 64px); font-weight: 500; line-height: .96; letter-spacing: -0.045em; text-wrap: balance"><span class="wd"><span style="animation-delay: .1s">Privacy</span></span> <span class="wd"><span style="animation-delay: .16s; color: #B93A0B">notice.</span></span></h1>
<p class="rise d2" style="margin-top: 28px; max-width: 460px; font-size: clamp(17px, 1.4vw, 19px); line-height: 1.55; color: #545B63; text-wrap: pretty">How Hito Robotics handles what you share with us through this website. In short: we collect only what you send us, we use it to reply, and we don’t track you.</p>
<div class="mono rise d3" style="margin-top: 32px; display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #545B63"><span>Last updated</span><span style="color: #0A0C0F">29 October 2026</span></div>
</div>
<div class="rise d2">
<section class="pv"><span class="mono n">01</span><h2>Who we are</h2><div><p>This website is run by Hito Robotics Private Limited (“Hito”, “we”), based in Delhi, India. If you have a question about this notice or about your information, write to <a href="mailto:privacy@hitorobotics.in">privacy@hitorobotics.in</a>.</p></div></section>
<section class="pv"><span class="mono n">02</span><h2>What we collect</h2><div><p>Only what you choose to send us. If you use the contact form, that’s your name, email address, organization (if you add one), the kind of enquiry you pick and your message. If you email us, it’s your email address and whatever your email contains.</p><p>Please don’t include health or patient information. We don’t need it to reply.</p></div></section>
<section class="pv"><span class="mono n">03</span><h2>What we don’t collect</h2><div><p>This website doesn’t use cookies, analytics or advertising trackers, and its fonts and images are served from the site itself. Our host, GitHub Pages, may record technical details such as IP addresses in its server logs to keep the service secure; see <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement" target="_blank" rel="noopener">GitHub’s privacy statement</a>.</p><p>Links to LinkedIn or to research papers take you to other websites, which have their own privacy policies.</p></div></section>
<section class="pv"><span class="mono n">04</span><h2>How we use it</h2><div><p>To read and answer your message, pass it to the right person on our team, and keep a record of our conversation. We don’t sell your information, share it for advertising, or add you to a mailing list.</p></div></section>
<section class="pv"><span class="mono n">05</span><h2>Who else handles it</h2><div><p>Messages from the contact form go through FormSubmit (formsubmit.co), a service that turns form submissions into emails and delivers them to our inbox. Our email provider stores our correspondence. These services may process information outside India.</p></div></section>
<section class="pv"><span class="mono n">06</span><h2>How long we keep it</h2><div><p>As long as we need it to reply, follow up and keep reasonable records of our conversations. We delete it when it’s no longer needed, or sooner if you ask.</p></div></section>
<section class="pv"><span class="mono n">07</span><h2>Your rights</h2><div><p>You can ask to see the information you’ve shared with us, have it corrected or deleted, or withdraw your consent to us keeping it. Write to <a href="mailto:privacy@hitorobotics.in">privacy@hitorobotics.in</a> and we’ll respond as soon as we can.</p><p>If you have a complaint, raise it with us at the same address first. Under India’s Digital Personal Data Protection Act, 2023, you may also be able to take it to the Data Protection Board of India.</p></div></section>
<section class="pv"><span class="mono n">08</span><h2>Changes to this notice</h2><div><p>If we change how we handle information, we’ll update this page and the date at the top.</p></div></section>

      menuOpen: this.state.menu,
      menuLabel: this.state.menu ? 'Close menu' : 'Open menu',
      toggleMenu: this.toggleMenu
    };
  }
}

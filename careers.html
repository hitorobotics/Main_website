<style>
body{margin:0;background:#0A0C0F}
html{scroll-behavior:smooth}
.site{--signal:#FF5B1F;font-family:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-kerning:normal}
.site *,.site *::before,.site *::after{box-sizing:border-box}
.site h1,.site h2,.site h3,.site p{margin:0}
:where(.site a){color:inherit;text-decoration:none}
:where(.site a:hover){color:inherit}
.site button{font-family:inherit}
.site ::selection{background:var(--signal);color:#0A0C0F}
.site :focus-visible{outline:2px solid var(--signal);outline-offset:3px}
.site section[id]{scroll-margin-top:72px}
.mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.site .skip{position:absolute;left:16px;top:-64px;z-index:100;padding:12px 18px;border-radius:999px;background:var(--signal);color:#0A0C0F;font-size:15px;font-weight:500;transition:top .25s}
.site .skip:focus{top:12px}
.hdr{background:rgba(10,12,15,.82);border-bottom:1px solid rgba(236,238,240,.08);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px)}
.navlink{position:relative;padding:10px 2px;color:#9AA3AD;transition:color .2s}
.navlink:hover,.navlink.here{color:#ECEEF0}
.navlink::after{content:'';position:absolute;left:2px;right:2px;bottom:4px;height:1px;background:var(--signal);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.navlink:hover::after,.navlink.here::after{transform:scaleX(1)}
.nav-sep{width:1px;height:16px;background:rgba(236,238,240,.16)}
.nav-links{display:flex}
.nav-burger{display:none}
@media (max-width:1100px){.nav-links{display:none}.nav-burger{display:inline-flex}}
@media (max-width:520px){.site .nav-cta{display:none}}
@keyframes hstep{from{transform:rotate(0deg)}to{transform:rotate(25.714deg)}}
@keyframes hin{0%,30%{opacity:0}100%{opacity:1}}
@keyframes hout{0%{opacity:1}70%,100%{opacity:0}}
.hr-in{opacity:0}
.logo .hring{transition:fill .4s}
.logo:hover .hring{fill:var(--signal);animation:hstep 1.1s linear infinite}
.logo:hover .hr-in{animation:hin 1.1s linear infinite}
.logo:hover .hr-out{animation:hout 1.1s linear infinite}
.hring-auto{animation:hstep 3.6s linear infinite}
.hring-auto .hr-in{animation:hin 3.6s linear infinite}
.hring-auto .hr-out{animation:hout 3.6s linear infinite}
.nw{white-space:nowrap}
.site p,.site li{text-wrap:pretty}
.site h3,.site h4{text-wrap:balance}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid transparent;font-size:16px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;transition:background-color .25s,color .25s,border-color .25s,transform .15s}
.btn:active{transform:scale(.98)}
.btn .arw{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.btn:hover .arw{transform:translateX(4px)}
.btn:hover .arw.down{transform:translateY(3px)}
.btn-primary{background:var(--signal);color:#0A0C0F}
.btn-primary:hover{background:#ECEEF0;color:#0A0C0F}
.btn-ghost{background:transparent;color:#ECEEF0;border-color:rgba(236,238,240,.28)}
.btn-ghost:hover{border-color:#ECEEF0;background:rgba(236,238,240,.04)}
.btn-ink{background:#0A0C0F;color:#ECEEF0}
.btn-ink:hover{background:var(--signal);color:#0A0C0F}

@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes wordup{from{transform:translateY(110%)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes hdr{from{background-color:rgba(10,12,15,.25);border-bottom-color:rgba(236,238,240,0)}to{background-color:rgba(10,12,15,.82);border-bottom-color:rgba(236,238,240,.08)}}
@keyframes wmrise{from{transform:translateY(35%);opacity:0}to{transform:none;opacity:1}}
@keyframes glrun{0%{transform:translateX(0);opacity:1}80%{transform:translateX(24px);opacity:1}100%{transform:translateX(24px);opacity:0}}
@keyframes glfade{0%,100%{opacity:.7}50%{opacity:.08}}
@keyframes glscan{0%,100%{transform:translateY(0)}50%{transform:translateY(20px)}}
@keyframes glcross{0%,100%{transform:translate(0,0)}25%{transform:translate(7px,-3px)}50%{transform:translate(2px,4px)}75%{transform:translate(-6px,1px)}}
@keyframes gldraw{0%{stroke-dashoffset:0}25%{stroke-dashoffset:1}65%,100%{stroke-dashoffset:0}}
@keyframes glflow{to{stroke-dashoffset:-24}}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.d2{animation-delay:.6s}.d3{animation-delay:.75s}
.wd{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .06em .14em 0;margin:0 -.06em -.14em 0}
.wd>span{display:inline-block;animation:wordup 1.1s cubic-bezier(.2,.75,.15,1) both}
.blink{animation:blink 1.6s ease-in-out infinite}
.spin-rev{transform-box:fill-box;transform-origin:center;animation:spinr 90s linear infinite}
.orbit{transform-box:view-box;transform-origin:600px 575px;animation:spin 48s linear infinite}
.orbit2{transform-box:view-box;transform-origin:600px 575px;animation:spinr 72s linear infinite}

.prob{display:flex;flex-direction:column;gap:12px;padding-top:22px;position:relative}
.prob::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:rgba(10,12,15,.16)}
.prob::after{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:var(--signal);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.prob:hover::after{transform:scaleX(1)}
.gl{display:block;width:48px;height:48px;overflow:visible;fill:none;stroke:#0A0C0F;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.g-run{animation:glrun 1.6s linear infinite}
.g-rip{animation:glfade 1.4s ease-in-out infinite}
.g-rip2{animation:glfade 1.4s ease-in-out .3s infinite}
.g-rot{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
.g-rot2{transform-box:fill-box;transform-origin:center;animation:spinr 2.4s linear infinite}
.g-move{animation:glflow 1s linear infinite}
.g-cross{animation:glcross 3s ease-in-out infinite}
.g-scan{animation:glscan 2.4s ease-in-out infinite}
.g-check{stroke-dasharray:1;animation:gldraw 2s ease-in-out infinite}
.prob .gl *{animation-play-state:paused}
.prob:hover .gl *{animation-play-state:running}

.role{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px 32px;padding:26px 0;transition:padding .35s cubic-bezier(.2,.7,.2,1)}
.role::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:rgba(236,238,240,.14)}
.role::after{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:var(--signal);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.role:hover{padding-left:12px}
.role:hover::after{transform:scaleX(1)}
.role .arw{color:#7D8792;transition:transform .35s cubic-bezier(.2,.7,.2,1),color .25s}
.role:hover .arw{transform:translateX(4px);color:var(--signal)}
.rtag{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7D8792}
.rtag b{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:20px;padding:0 6px;border-radius:999px;border:1px solid rgba(236,238,240,.18);font-weight:500;color:#C9D0D6;transition:border-color .25s,color .25s}
.role:hover .rtag b{border-color:var(--signal);color:#ECEEF0}
.flink{color:#9AA3AD;transition:color .2s}
.flink:hover{color:#ECEEF0}
.quad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.quad{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.quad{grid-template-columns:minmax(0,1fr)}}
.totop{display:inline-flex;align-items:center;gap:8px;color:#9AA3AD;transition:color .2s}
.totop:hover{color:#ECEEF0}
.totop svg{transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.totop:hover svg{transform:translateY(-3px)}

@supports (animation-timeline: view()){
.rv{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 24%}
.chap-rule{animation:growx linear both;animation-timeline:view();animation-range:entry 10% cover 30%}
.wm{animation:wmrise linear both;animation-timeline:view();animation-range:entry 0% cover 30%}
.hdr{animation:hdr linear both;animation-timeline:scroll(root);animation-range:0 240px}
}
@media (prefers-reduced-motion:reduce){.site *,.site *::before,.site *::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.site.still *,.site.still *::before,.site.still *::after{animation:none!important}
</style>
</head>

<section id="problems" style="background: #F1F2EF; color: #0A0C0F; padding: clamp(80px, 8vw, 120px) 0">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 clamp(20px, 4.5vw, 56px)">
<div class="mono rv" style="display: flex; align-items: center; gap: 14px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #545B63"><span><span style="color: #B93A0B">01</span><span style="opacity: .55"> / 02</span></span><span class="chap-rule" style="width: 64px; height: 1px; background: var(--signal); transform-origin: left"></span><span>Problems you’d work on</span></div>
<div style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 32px 72px; align-items: end">
<h2 class="rv" style="font-size: clamp(36px, 4.9vw, 72px); font-weight: 500; line-height: 1; letter-spacing: -0.04em; text-wrap: balance">Hard problems, with no textbook answers.</h2>
<p class="rv" style="max-width: 540px; font-size: clamp(17px, 1.35vw, 19px); line-height: 1.6; color: #545B63; text-wrap: pretty">Carrying a physician’s skill across distance touches almost every discipline in engineering. These are the questions on our whiteboard.</p>
</div>
<div class="rv" style="margin-top: 72px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 56px 40px">
<div class="prob">
<div style="display: flex; justify-content: space-between; align-items: flex-start"><span class="mono" style="font-size: 12px; color: #B93A0B">01</span><svg class="gl" viewBox="0 0 48 48" aria-hidden="true"><circle cx="8" cy="24" r="4"></circle><circle cx="40" cy="24" r="4"></circle><path d="M12 24 H36" style="stroke-dasharray: 2 3; stroke-opacity: .5"></path><circle class="g-run" cx="12" cy="24" r="2.6" style="fill: var(--signal); stroke: none"></circle></svg></div>
<h3 style="font-size: 24px; font-weight: 500; letter-spacing: -0.02em">Responsiveness over distance</h3>
<p style="font-size: 16px; line-height: 1.55; color: #545B63">Keeping remote control fast, predictable and <span class="nw">fail-safe</span> when networks aren’t perfect.</p>
</div>
<div class="prob">
<div style="display: flex; justify-content: space-between; align-items: flex-start"><span class="mono" style="font-size: 12px; color: #B93A0B">02</span><svg class="gl" viewBox="0 0 48 48" aria-hidden="true"><path d="M4 36 H44"></path><circle cx="24" cy="36" r="3" style="fill: var(--signal); stroke: none"></circle><path class="g-rip" d="M17 29 A10 10 0 0 1 31 29" style="stroke: var(--signal)"></path><path class="g-rip2" d="M12 23 A17 17 0 0 1 36 23" style="stroke: var(--signal)"></path></svg></div>
<h3 style="font-size: 24px; font-weight: 500; letter-spacing: -0.02em">A sense of touch</h3>
<p style="font-size: 16px; line-height: 1.55; color: #545B63">Physicians feel resistance through the wire. Carrying that feel through a robot is an open problem.</p>
</div>
<div class="prob">
<div style="display: flex; justify-content: space-between; align-items: flex-start"><span class="mono" style="font-size: 12px; color: #B93A0B">03</span><svg class="gl" viewBox="0 0 48 48" aria-hidden="true"><path d="M2 24 H46" style="stroke: var(--signal); stroke-width: 2"></path><path class="g-move" d="M2 24 H46" style="stroke: #F1F2EF; stroke-width: 2.4; stroke-dasharray: 3 9"></path><g class="g-rot2"><circle cx="24" cy="14" r="9"></circle><path d="M24 5 V9"></path></g><g class="g-rot"><circle cx="24" cy="34" r="9"></circle><path d="M24 43 V39"></path></g></svg></div>
<h3 style="font-size: 24px; font-weight: 500; letter-spacing: -0.02em">Precision with flexible tools</h3>
<p style="font-size: 16px; line-height: 1.55; color: #545B63">Gripping, pushing and twisting thin, slippery instruments without slipping, buckling or damage.</p>
</div>
<div class="prob">
<div style="display: flex; justify-content: space-between; align-items: flex-start"><span class="mono" style="font-size: 12px; color: #B93A0B">04</span><svg class="gl" viewBox="0 0 48 48" aria-hidden="true"><rect x="5" y="8" width="38" height="26" rx="3"></rect><path d="M24 34 V40"></path><path d="M16 42 H32"></path><g class="g-cross"><circle cx="24" cy="21" r="4" style="stroke: var(--signal)"></circle><path d="M24 14 V17 M24 25 V28 M17 21 H20 M28 21 H31" style="stroke: var(--signal)"></path></g></svg></div>
<h3 style="font-size: 24px; font-weight: 500; letter-spacing: -0.02em">Interfaces clinicians trust</h3>
<p style="font-size: 16px; line-height: 1.55; color: #545B63">Consoles that respect how interventionalists already think, see and move&nbsp;— under pressure.</p>
</div>
<div class="prob">
<div style="display: flex; justify-content: space-between; align-items: flex-start"><span class="mono" style="font-size: 12px; color: #B93A0B">05</span><svg class="gl" viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="6" width="36" height="36" rx="3"></rect><path d="M12 36 C16 28 20 30 23 22 C26 14 31 17 36 12" style="stroke-opacity: .45"></path><path class="g-scan" d="M9 13 H39" style="stroke: var(--signal)"></path></svg></div>
<h3 style="font-size: 24px; font-weight: 500; letter-spacing: -0.02em">Imaging in the loop</h3>
<p style="font-size: 16px; line-height: 1.55; color: #545B63">Getting live <span class="nw">X-ray</span> and system state to a remote physician clearly and reliably.</p>
</div>
<div class="prob">
<div style="display: flex; justify-content: space-between; align-items: flex-start"><span class="mono" style="font-size: 12px; color: #B93A0B">06</span><svg class="gl" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5 L39 11 V23 C39 32 32 39 24 43 C16 39 9 32 9 23 V11 Z"></path><path class="g-check" pathLength="1" d="M17 24 L22 29 L31 19" style="stroke: var(--signal); stroke-width: 2"></path></svg></div>
<h3 style="font-size: 24px; font-weight: 500; letter-spacing: -0.02em">Safety you can verify</h3>
<p style="font-size: 16px; line-height: 1.55; color: #545B63">Architecture, testing and evidence rigorous enough to earn the trust of clinicians and regulators.</p>
</div>
</div>
</div>
</section>

      accent: this.props.accent ?? '#FF5B1F',
      siteCls: motion ? 'site' : 'site still',

      menuLabel: this.state.menu ? 'Close menu' : 'Open menu',

      closeMenu: this.closeMenu
    };
  }
}

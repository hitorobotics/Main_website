<style>
body{margin:0;background:#0A0C0F}
.site{--signal:#FF5B1F;font-family:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-kerning:normal}
.site *,.site *::before,.site *::after{box-sizing:border-box}
.site h1,.site h2,.site h3,.site p{margin:0}
:where(.site a){color:inherit;text-decoration:none}
:where(.site a:hover){color:inherit}
.site button,.site input,.site textarea{font-family:inherit}
.site ::selection{background:var(--signal);color:#0A0C0F}
.site :focus-visible{outline:2px solid var(--signal);outline-offset:3px}
.mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.site .skip{position:absolute;left:16px;top:-64px;z-index:100;padding:12px 18px;border-radius:999px;background:var(--signal);color:#0A0C0F;font-size:15px;font-weight:500;transition:top .25s}
.site .skip:focus{top:12px}
.hdr{background:rgba(10,12,15,.82);border-bottom:1px solid rgba(236,238,240,.08);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px)}
.navlink{position:relative;padding:10px 2px;color:#9AA3AD;transition:color .2s}
.navlink:hover{color:#ECEEF0}
.navlink::after{content:'';position:absolute;left:2px;right:2px;bottom:4px;height:1px;background:var(--signal);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.navlink:hover::after{transform:scaleX(1)}
.nav-sep{width:1px;height:16px;background:rgba(236,238,240,.16)}
.nav-links{display:flex}
.nav-burger{display:none}
@media (max-width:1100px){.nav-links{display:none}.nav-burger{display:inline-flex}}
@media (max-width:520px){.site .nav-cta{display:none}}
@keyframes hstep{from{transform:rotate(0deg)}to{transform:rotate(25.714deg)}}
@keyframes hin{0%,30%{opacity:0}100%{opacity:1}}
@keyframes hout{0%{opacity:1}70%,100%{opacity:0}}
.hr-in{opacity:0}
.logo .hring{transition:fill .4s}
.logo:hover .hring{fill:var(--signal);animation:hstep 1.1s linear infinite}
.logo:hover .hr-in{animation:hin 1.1s linear infinite}
.logo:hover .hr-out{animation:hout 1.1s linear infinite}
.nw{white-space:nowrap}
.site p,.site li{text-wrap:pretty}
.site h3,.site h4{text-wrap:balance}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid transparent;font-size:16px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;transition:background-color .25s,color .25s,border-color .25s,transform .15s}
.btn:active{transform:scale(.98)}
.btn .arw{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.btn:hover .arw{transform:translateX(4px)}
.btn-primary{background:var(--signal);color:#0A0C0F}
.btn-primary:hover{background:#ECEEF0;color:#0A0C0F}
.btn-ghost{background:transparent;color:#ECEEF0;border-color:rgba(236,238,240,.28)}
.btn-ghost:hover{border-color:#ECEEF0;background:rgba(236,238,240,.04)}
.btn[disabled]{cursor:progress}
.spinner{display:none;width:14px;height:14px;border-radius:50%;border:2px solid rgba(10,12,15,.25);border-top-color:#0A0C0F;animation:spin .7s linear infinite}
.is-sending .spinner{display:inline-block}
.is-sending .arw{display:none}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid rgba(236,238,240,.2);background:transparent;color:#C9D0D6;cursor:pointer;font-size:14px;font-weight:500;transition:background-color .25s,color .25s,border-color .25s}
.chip:hover{border-color:rgba(236,238,240,.6);color:#ECEEF0}
.chip[aria-pressed="true"]{background:#ECEEF0;color:#0A0C0F;border-color:#ECEEF0}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.flabel{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9AA3AD}
.field input,.field textarea{width:100%;min-height:48px;padding:12px 0;background:transparent;border:0;border-bottom:1px solid rgba(236,238,240,.22);border-radius:0;color:#ECEEF0;font-size:18px;line-height:1.4;outline:none;transition:border-color .25s}
.field textarea{min-height:120px;max-height:320px;resize:none;field-sizing:content}
.field input::placeholder,.field textarea::placeholder{color:#7D8792}
.field input:hover,.field textarea:hover{border-color:rgba(236,238,240,.45)}
.field input:focus,.field textarea:focus{border-color:var(--signal);box-shadow:0 1px 0 var(--signal)}
.field input:focus-visible,.field textarea:focus-visible{outline:none}
.field:focus-within label{color:#ECEEF0}
.field.bad input,.field.bad textarea{border-color:#FF8A80}
.field.bad label{color:#FF8A80}
.ferr{min-height:18px;font-size:13px;line-height:1.4;color:#FF8A80}
.ferr-box{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,138,128,.35);background:rgba(255,138,128,.07);font-size:15px;line-height:1.5;color:#ECEEF0}
.ferr-box a{color:#FF8A80;text-decoration:underline;text-underline-offset:3px}
.hp{position:absolute!important;left:-10000px!important;width:1px;height:1px;opacity:0;pointer-events:none}
.plink{color:#C9D0D6;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(201,208,214,.4);transition:color .2s,text-decoration-color .2s}
.plink:hover{color:#ECEEF0;text-decoration-color:var(--signal)}
.drow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:center;gap:16px;min-height:64px;padding:10px 0;border-top:1px solid rgba(10,12,15,.14)}
.drow a{transition:color .2s}
@media (max-width:520px){.drow{grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0}.drow>:first-child{grid-column:1/-1}}
.drow a:hover{color:#B93A0B}
.copy{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(10,12,15,.18);background:transparent;color:#545B63;font-size:12px;letter-spacing:.06em;cursor:pointer;transition:border-color .2s,color .2s,background-color .2s}
.copy:hover{border-color:#0A0C0F;color:#0A0C0F}
.copy.ok{border-color:#0A0C0F;background:#0A0C0F;color:#F1F2EF}
.flink{color:#9AA3AD;transition:color .2s}
.flink:hover{color:#ECEEF0}
.quad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.quad{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.quad{grid-template-columns:minmax(0,1fr)}}
.totop{display:inline-flex;align-items:center;gap:8px;color:#9AA3AD;transition:color .2s}
.totop:hover{color:#ECEEF0}
.totop svg{transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.totop:hover svg{transform:translateY(-3px)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes wordup{from{transform:translateY(110%)}to{transform:none}}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes wmrise{from{transform:translateY(35%);opacity:0}to{transform:none;opacity:1}}
@keyframes hdr{from{background-color:rgba(10,12,15,.25);border-bottom-color:rgba(236,238,240,0)}to{background-color:rgba(10,12,15,.82);border-bottom-color:rgba(236,238,240,.08)}}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.d2{animation-delay:.5s}.d3{animation-delay:.65s}
.wd{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .06em .14em 0;margin:0 -.06em -.14em 0}
.wd>span{display:inline-block;animation:wordup 1.1s cubic-bezier(.2,.75,.15,1) both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(.2,.7,.2,1) infinite}
.ok-ring{stroke-dasharray:1;animation:draw .8s cubic-bezier(.55,.05,.25,1) both}
.ok-tick{stroke-dasharray:1;animation:draw .5s cubic-bezier(.55,.05,.25,1) .65s both}
.ok-in{animation:rise .8s cubic-bezier(.2,.7,.2,1) .3s both}
@supports (animation-timeline: scroll()){
.hdr{animation:hdr linear both;animation-timeline:scroll(root);animation-range:0 240px}
}
@supports (animation-timeline: view()){
.wm{animation:wmrise linear both;animation-timeline:view();animation-range:entry 0% cover 30%}
}
@media (prefers-reduced-motion:reduce){.site *,.site *::before,.site *::after{animation:none!important;transition:none!important}}
.site.still *,.site.still *::before,.site.still *::after{animation:none!important}
</style>
</head>

</sc-for>
</div>
<p aria-live="polite" style="font-size: 15px; line-height: 1.5; color: #AEB6BF; min-height: 46px">{{ helper }}</p>
</fieldset>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 18px 24px">
<div class="{{ fc.name }}"><label for="c-name">Name</label><input id="c-name" name="name" type="text" autocomplete="name" placeholder="Your name" aria-invalid="{{ inv.name }}" aria-describedby="c-name-err" onInput="{{ clearName }}"><span id="c-name-err" class="ferr" aria-live="polite">{{ er.name }}</span></div>
<div class="{{ fc.email }}"><label for="c-email">Email</label><input id="c-email" name="email" type="email" autocomplete="email" placeholder="you@organization.com" aria-invalid="{{ inv.email }}" aria-describedby="c-email-err" onInput="{{ clearEmail }}"><span id="c-email-err" class="ferr" aria-live="polite">{{ er.email }}</span></div>
</div>
<div class="field"><label for="c-org">Organization <span style="text-transform: none; letter-spacing: 0; color: #7D8792">(optional)</span></label><input id="c-org" name="organization" type="text" autocomplete="organization" placeholder="{{ orgPh }}"></div>
<div class="{{ fc.message }}">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px"><label for="c-msg">Message</label><span class="mono" style="font-size: 11px; letter-spacing: .06em; color: {{ countColor }}">{{ count }} / 1000</span></div>
<textarea id="c-msg" name="message" rows="4" maxlength="1000" placeholder="{{ msgPh }}" aria-invalid="{{ inv.message }}" aria-describedby="c-msg-err" onInput="{{ onMsg }}"></textarea>
<span id="c-msg-err" class="ferr" aria-live="polite">{{ er.message }}</span>
</div>
<input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
<sc-if value="{{ failed }}" hint-placeholder-val="{{ false }}">
<div class="ferr-box" role="alert"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="flex: none; margin-top: 2px; fill: none; stroke: #FF8A80; stroke-width: 1.5; stroke-linecap: round"><circle cx="9" cy="9" r="7.25"></circle><path d="M9 5.2 V9.6"></path><path d="M9 12.4 V12.5"></path></svg><span>We couldn’t send that just now. Your message is still here&nbsp;— <a href="{{ mailtoHref }}">email it to {{ toEmail }}</a> instead.</span></div>
</sc-if>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<span class="mono" style="display: inline-flex; flex-wrap: wrap; gap: 4px 16px; font-size: 11px; letter-spacing: .04em; color: #7D8792"><span>Goes to <span style="color: #C9D0D6">{{ toEmail }}</span></span><a class="plink" href="/privacy">Privacy</a></span>
<button type="submit" class="btn btn-primary {{ sendCls }}" disabled="{{ sending }}"><span class="spinner" aria-hidden="true"></span>{{ sendLabel }}<svg class="arw" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M3 8 H13"></path><path d="M9 4 L13 8 L9 12"></path></svg></button>
</div>
</form>
</sc-if>
<sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
<div role="status" style="flex: 1; min-height: 460px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 22px">
<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle class="ok-ring" pathLength="1" cx="32" cy="32" r="30" style="fill: none; stroke: var(--signal); stroke-width: 1.5"></circle><path class="ok-tick" pathLength="1" d="M20 33 L28 41 L45 23" style="fill: none; stroke: var(--signal); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"></path></svg>
<h2 class="ok-in" style="font-size: clamp(30px, 3vw, 42px); font-weight: 500; line-height: 1.05; letter-spacing: -0.03em; text-wrap: balance">Thank you{{ whoComma }}. Your message is on its way.</h2>
<p class="ok-in" style="max-width: 440px; font-size: 17px; line-height: 1.55; color: #AEB6BF">We’ll get back to you soon. In the meantime, the story of what we’re building is one click away.</p>
<sc-if value="{{ preview }}" hint-placeholder-val="{{ false }}"><p class="mono ok-in" style="max-width: 440px; font-size: 11px; line-height: 1.6; letter-spacing: .04em; color: #7D8792">Preview only. On hitorobotics.com this message is emailed to {{ sentTo }}.</p></sc-if>
<div class="ok-in" style="display: flex; flex-wrap: wrap; gap: 12px">
<a class="btn btn-primary" href="/">Read the story<svg class="arw" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M3 8 H13"></path><path d="M9 4 L13 8 L9 12"></path></svg></a>
<button type="button" class="btn btn-ghost" onClick="{{ again }}">Send another message</button>
</div>
</div>
</sc-if>
</div>
</div>
</section>

<script src="/assets/hito-runtime.js"></script>
<script>
(function () {
var DCLogic = window.DCLogic;
const AUDIENCES = [
  { id: 'investor', to: 'investors@hitorobotics.in', name: 'Investor', helper: 'Interested in our vision, approach and progress? We’re glad to share more.', org: 'Fund or firm', msg: 'What would you like to learn about Hito?' },
  { id: 'engineer', to: 'careers@hitorobotics.in', name: 'Engineer or researcher', helper: 'Tell us what you’ve built and which of our problems you’d want to own.', org: 'Current team or lab', msg: 'A project, paper or problem you care about' },
  { id: 'clinician', to: 'clinical@hitorobotics.in', name: 'Clinician', helper: 'We want to learn from interventionalists. Your perspective shapes what we build.', org: 'Hospital or practice', msg: 'Your specialty, and what remote intervention should get right' },
  { id: 'hospital', to: 'partners@hitorobotics.in', name: 'Hospital', helper: 'For hospitals and health systems: explore what remote intervention could mean for your patients and teams.', org: 'Hospital or health system', msg: 'Your region, your patients and the access gaps you see' },
  { id: 'partner', to: 'partners@hitorobotics.in', name: 'Partner', helper: 'Research, industry or network partner\u00A0— let’s explore working together.', org: 'Organization', msg: 'The collaboration you have in mind' }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: false, aud: 'investor', sent: false, sending: false, failed: false, preview: false, sentTo: '', draft: null, errors: {}, count: 0, who: '', copied: '' };
    this.t = null;
    this.ct = null;
    this.toggleMenu = () => this.setState({ menu: !this.state.menu });
    this.clear = (k) => () => {
      if (!this.state.errors[k]) return;
      const n = Object.assign({}, this.state.errors);
      delete n[k];
      this.setState({ errors: n });
    };
    this.clearName = this.clear('name');
    this.clearEmail = this.clear('email');
    this.onMsg = (e) => {
      const v = (e && e.target && e.target.value) || '';
      const next = { count: v.length };
      if (this.state.errors.message && v.trim().length >= 10) {
        const er = Object.assign({}, this.state.errors);
        delete er.message;
        next.errors = er;
      }
      this.setState(next);
    };
    this.submit = (e) => {
      if (e && e.preventDefault) e.preventDefault();
      if (this.state.sending) return;
      const f = e && e.currentTarget;
      const val = (n) => (f && f.elements && f.elements[n] ? String(f.elements[n].value || '').trim() : '');
      const name = val('name'), email = val('email'), message = val('message');
      const errors = {};
      if (!name) errors.name = 'Please add your name.';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors.email = 'Please enter a valid email address.';
      if (message.length < 10) errors.message = 'A sentence or two helps us route your note.';
      const first = ['name', 'email', 'message'].find((k) => errors[k]);
      if (first) {
        this.setState({ errors: errors });
        if (f && f.elements && f.elements[first] && f.elements[first].focus) f.elements[first].focus();
        return;
      }
      const aud = AUDIENCES.find((a) => a.id === this.state.aud) || AUDIENCES[0];
      const org = val('organization');
      const draft = { name: name, email: email, org: org, message: message, to: aud.to, audName: aud.name };
      this.setState({ errors: {}, sending: true, failed: false, who: name.split(' ')[0], draft: draft });
      const done = (ok) => this.setState(ok ? { sending: false, sent: true, sentTo: aud.to } : { sending: false, failed: true });
      if (val('_honey')) { this.t = setTimeout(() => done(true), 900); return; }
      const live = (typeof window !== 'undefined') && (window.__hitoLive || /(^|\.)hitorobotics\.com$/.test(window.location.hostname));
      if (!live) { this.t = setTimeout(() => { this.setState({ preview: true }); done(true); }, 1100); return; }
      fetch('https://formsubmit.co/ajax/' + aud.to, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({
          name: name, email: email, organization: org || '—', reaching_out_as: aud.name, message: message,
          _subject: 'Website message from ' + name + ' (' + aud.name + ')',
          _replyto: email, _template: 'table', _captcha: 'false'
        })
      })
        .then((r) => r.json())
        .then((j) => done(j && String(j.success) === 'true'))
        .catch(() => done(false));
    };
    this.again = () => this.setState({ sent: false, failed: false, preview: false, draft: null, count: 0, errors: {} });
    this.copy = (key) => (e) => {
      const btn = e && e.currentTarget;
      const row = btn && btn.closest ? btn.closest('.drow') : null;
      const src = row ? row.querySelector('[data-copy]') : null;
      const text = src ? src.textContent.trim() : '';
      const done = (ok) => {
        this.setState({ copied: ok ? key : 'fail-' + key });
        clearTimeout(this.ct);
        this.ct = setTimeout(() => this.setState({ copied: '' }), 1800);
      };
      try {
        navigator.clipboard.writeText(text).then(() => done(true), () => done(false));
      } catch (err) {
        done(false);
      }
    };
    this.copyGeneral = this.copy('general');
    this.copyCareers = this.copy('careers');
  }

  componentDidMount() {
    const m = /[?&]as=(investor|engineer|clinician|hospital|partner)\b/.exec((typeof window !== 'undefined' && window.location.search) || '');
    if (m) this.setState({ aud: m[1] });
  }

  componentWillUnmount() {
    clearTimeout(this.t);
    clearTimeout(this.ct);
  }

  renderVals() {
    const s = this.state;
    const motion = this.props.motion ?? true;
    const A = AUDIENCES;
    const cur = A.find((a) => a.id === s.aud) || A[0];
    const er = s.errors || {};
    const label = (k) => (s.copied === k ? 'Copied' : (s.copied === 'fail-' + k ? 'Copy unavailable' : 'Copy'));
    return {
      accent: this.props.accent ?? '#FF5B1F',
      siteCls: motion ? 'site' : 'site still',
      menuOpen: s.menu,
      menuLabel: s.menu ? 'Close menu' : 'Open menu',
      toggleMenu: this.toggleMenu,
      audiences: A.map((a) => ({ name: a.name, pressed: a.id === s.aud, pick: () => this.setState({ aud: a.id }) })),
      helper: cur.helper, orgPh: cur.org, msgPh: cur.msg,
      fc: { name: er.name ? 'field bad' : 'field', email: er.email ? 'field bad' : 'field', message: er.message ? 'field bad' : 'field' },
      inv: { name: !!er.name, email: !!er.email, message: !!er.message },
      er: { name: er.name || '', email: er.email || '', message: er.message || '' },
      clearName: this.clearName, clearEmail: this.clearEmail, onMsg: this.onMsg,
      count: s.count, countColor: s.count > 900 ? '#FF8A80' : '#7D8792',
      sending: s.sending, sendCls: s.sending ? 'is-sending' : '', sendLabel: s.sending ? 'Sending…' : 'Send message',
      sent: s.sent, notSent: !s.sent, failed: s.failed, preview: s.preview, sentTo: s.sentTo,
      toEmail: cur.to,
      mailtoHref: 'mailto:' + cur.to + '?subject=' + encodeURIComponent('Website message' + (s.draft ? ' from ' + s.draft.name : '')) + '&body=' + encodeURIComponent(s.draft ? s.draft.message + '\n\n— ' + s.draft.name + (s.draft.org ? ', ' + s.draft.org : '') + ' (' + s.draft.email + ')' : ''),
      whoComma: s.who ? ', ' + s.who : '',
      submit: this.submit, again: this.again,
      copyGeneral: this.copyGeneral, copyCareers: this.copyCareers,
      copyLabel: { general: label('general'), careers: label('careers') },
      copyCls: { general: s.copied === 'general' ? 'copy mono ok' : 'copy mono', careers: s.copied === 'careers' ? 'copy mono ok' : 'copy mono' }
    };
  }
}
window.HitoApp.mount(Component, {"accent": "#FF5B1F", "motion": true});
})();
</script>

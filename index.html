<style>
body{margin:0;background:#0A0C0F}
html{scroll-behavior:smooth}
.site{--signal:#FF5B1F;font-family:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-kerning:normal;timeline-scope:--t-problem,--t-procedure,--t-skill,--t-technology,--t-vision,--stmt}
.site *,.site *::before,.site *::after{box-sizing:border-box}
.site h1,.site h2,.site h3,.site h4,.site p,.site ol{margin:0}
:where(.site a){color:inherit;text-decoration:none}
:where(.site a:hover){color:inherit}
.site button{font-family:inherit}
.site sup{font-size:.6em;line-height:0;vertical-align:super}
.site kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;border:1px solid rgba(236,238,240,.22);border-bottom-width:2px;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;color:#C9D0D6}
.site ::selection{background:var(--signal);color:#0A0C0F}
.site :focus-visible{outline:2px solid var(--signal);outline-offset:3px}
.site section[id]{scroll-margin-top:72px}
.nw{white-space:nowrap}
.site p,.site li{text-wrap:pretty}
.site h3,.site h4{text-wrap:balance}
.mapcap{display:grid}
.mapcap p{grid-area:1/1;font-size:16px;line-height:1.55;color:#AEB6BF;transition:opacity .45s ease .12s,visibility 0s linear 0s}
.mapcap p.off{opacity:0;visibility:hidden;transition:opacity .2s ease,visibility 0s linear .2s}
.hlbl{paint-order:stroke fill;stroke:#0A0C0F;stroke-width:5px;stroke-linejoin:round}
.blbl text{paint-order:stroke fill;stroke:#161B21;stroke-width:4px;stroke-linejoin:round}
#problem{view-timeline-name:--t-problem}
#procedure{view-timeline-name:--t-procedure}
#skill{view-timeline-name:--t-skill}
#technology{view-timeline-name:--t-technology}
#vision{view-timeline-name:--t-vision}
.mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.site .skip{position:absolute;left:16px;top:-64px;z-index:100;padding:12px 18px;border-radius:999px;background:var(--signal);color:#0A0C0F;font-size:15px;font-weight:500;transition:top .25s}
.site .skip:focus{top:12px}

.hdr{background:rgba(10,12,15,.82);border-bottom:1px solid rgba(236,238,240,.08);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px)}
.navlink{position:relative;padding:10px 2px;color:#9AA3AD;transition:color .2s}
.navlink:hover{color:#ECEEF0}
.navlink::after{content:'';position:absolute;left:2px;right:2px;bottom:4px;height:1px;background:var(--signal);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.navlink:hover::after{transform:scaleX(1)}
.ndot{position:absolute;left:50%;top:0;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--signal);opacity:0;transform:scale(0)}
.nav-sep{width:1px;height:16px;background:rgba(236,238,240,.16)}
.nav-links{display:flex}
.nav-burger{display:none}
@media (max-width:1100px){.nav-links{display:none}.nav-burger{display:inline-flex}}
@media (max-width:520px){.site .nav-cta{display:none}}
.progress{transform:scaleX(0);transform-origin:0 50%}

@keyframes hstep{from{transform:rotate(0deg)}to{transform:rotate(25.714deg)}}
@keyframes hin{0%,30%{opacity:0}100%{opacity:1}}
@keyframes hout{0%{opacity:1}70%,100%{opacity:0}}
.hr-in{opacity:0}
.logo .hring{transition:fill .4s}
.logo:hover .hring{fill:var(--signal);animation:hstep 1.1s linear infinite}
.logo:hover .hr-in{animation:hin 1.1s linear infinite}
.logo:hover .hr-out{animation:hout 1.1s linear infinite}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid transparent;font-size:16px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;transition:background-color .25s,color .25s,border-color .25s,transform .15s}
.btn:active{transform:scale(.98)}
.btn .arw{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.btn:hover .arw{transform:translateX(4px)}
.btn:hover .arw.down{transform:translateY(3px)}
.btn-primary{background:var(--signal);color:#0A0C0F}
.btn-primary:hover{background:#ECEEF0;color:#0A0C0F}
.btn-ghost{background:transparent;color:#ECEEF0;border-color:rgba(236,238,240,.28)}
.btn-ghost:hover{border-color:#ECEEF0;background:rgba(236,238,240,.04)}

.toc{position:relative;display:flex;flex-direction:column;gap:8px;padding-top:18px;color:#9AA3AD;transition:color .25s}
.toc::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:rgba(236,238,240,.16)}
.toc::after{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:var(--signal);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.toc:hover{color:#ECEEF0}
.toc>span{text-wrap:balance}
.toc:hover::after{transform:scaleX(1)}
.toc .tz{font-size:13px;line-height:1.4;color:#7D8792;opacity:0;transform:translateY(-4px);transition:opacity .3s,transform .3s}
.toc:hover .tz,.toc:focus-visible .tz{opacity:1;transform:none}
@media (hover:none){.toc .tz{opacity:1;transform:none}}
.tocs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 24px}
@media (max-width:1000px){.tocs{gap:12px 16px}}
@media (max-width:700px){.tocs{grid-template-columns:minmax(0,1fr);gap:0}.tocs .toc{flex-direction:row;align-items:baseline;gap:14px;padding:14px 0}.tocs .toc .tz{display:none}}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:960px){.tri{grid-template-columns:minmax(0,1fr)}}
@media (min-width:760px) and (max-width:960px){.tri.tri-tight{grid-template-columns:repeat(3,minmax(0,1fr))}.tri-tight>div{padding:18px!important}}
.quad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.quad{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.quad{grid-template-columns:minmax(0,1fr)}}

.hero-art{position:absolute;top:8px;right:-60px;width:min(880px,62vw);aspect-ratio:1/1;pointer-events:none}
.hero-fx{will-change:transform}
.hero-scrim{background:linear-gradient(0deg,#0A0C0F 0%,rgba(10,12,15,.86) 16%,rgba(10,12,15,0) 38%),linear-gradient(90deg,#0A0C0F 0%,rgba(10,12,15,.94) 34%,rgba(10,12,15,.5) 52%,rgba(10,12,15,0) 72%)}
@media (max-width:900px){.hero-art{width:125vw;right:-48vw;top:auto;bottom:40px;opacity:.6}.hero-scrim{background:linear-gradient(180deg,rgba(10,12,15,.97) 0%,rgba(10,12,15,.8) 55%,rgba(10,12,15,.55) 100%)}}
.wd{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .06em .14em 0;margin:0 -.06em -.14em 0}
.wd>span{display:inline-block;animation:wordup 1.1s cubic-bezier(.2,.75,.15,1) both}
.uline{position:absolute;left:0;bottom:-.2em;width:calc(100% - .3em);height:.36em;overflow:visible;pointer-events:none}
.uline .u-wire{stroke-dasharray:1;animation:draw 1.4s cubic-bezier(.55,.05,.25,1) 1.2s both}
.uline .u-tip{animation:fadein .4s ease 2.5s both}

@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes comet{from{stroke-dashoffset:.02}to{stroke-dashoffset:-.99}}
@keyframes flow{to{stroke-dashoffset:-48}}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3);opacity:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes wordup{from{transform:translateY(110%)}to{transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bloom{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1)}100%{opacity:.5;transform:scale(.85)}}
@keyframes par{to{transform:translateY(160px) scale(1.03)}}
@keyframes copyup{to{transform:translateY(-40px)}}
@keyframes navon{from,to{color:#ECEEF0}}
@keyframes ndot{from,to{opacity:1;transform:scale(1)}}
@keyframes hdr{from{background-color:rgba(10,12,15,.25);border-bottom-color:rgba(236,238,240,0)}to{background-color:rgba(10,12,15,.82);border-bottom-color:rgba(236,238,240,.08)}}
@keyframes minute{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes wordlit{from{opacity:.14}to{opacity:1}}
@keyframes travel{0%{left:0;opacity:0}12%,88%{opacity:1}100%{left:calc(100% - 6px);opacity:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.8)}100%{transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.22)}24%{transform:scale(1)}36%{transform:scale(1.12)}50%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(3px)}60%{transform:translateX(-3px)}80%{transform:translateX(1.5px)}}
@keyframes shake2{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(3px)}60%{transform:translateX(-3px)}80%{transform:translateX(1.5px)}}
@keyframes flash{0%{stroke-opacity:0}30%{stroke-opacity:.55}100%{stroke-opacity:0}}
@keyframes flash2{0%{stroke-opacity:0}30%{stroke-opacity:.55}100%{stroke-opacity:0}}
@keyframes contrast{0%{opacity:0}25%{opacity:.5}100%{opacity:.14}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes push{0%,100%{transform:translateX(-16px)}50%{transform:translateX(16px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ripple{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.15);opacity:0}}
@keyframes wmrise{from{transform:translateY(35%);opacity:0}to{transform:none;opacity:1}}
@keyframes lane{0%{left:0;opacity:0}15%,85%{opacity:1}100%{left:calc(100% - 6px);opacity:0}}
@keyframes laneb{0%{left:calc(100% - 6px);opacity:0}15%,85%{opacity:1}100%{left:0;opacity:0}}

.wire{stroke-dasharray:1;animation:draw 3.8s cubic-bezier(.55,.05,.25,1) .5s both}
.comet{stroke-dasharray:.012 .988;animation:comet 3.4s cubic-bezier(.45,0,.25,1) 4.4s infinite backwards}
.flowline{stroke-dasharray:2 22;animation:flow 2.4s linear infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(.2,.7,.2,1) infinite}
.early{animation:fadein .8s ease 1s both}
.late{animation:fadein .8s ease 4.1s both}
.late2{animation:fadein .6s ease 4.6s both}
.bloom{transform-box:fill-box;transform-origin:center;animation:bloom 2.2s cubic-bezier(.2,.7,.2,1) 4.2s both}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.7s}.d3{animation-delay:.85s}
.blink{animation:blink 1.6s ease-in-out infinite}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.1s ease-in-out infinite}

.track{position:relative;height:8px;border-radius:4px;background:rgba(10,12,15,.08);overflow:hidden}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transform-origin:left}
.ticks10::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#F1F2EF calc(10% - 2px) 10%);pointer-events:none}
.ticks60::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100% / 60 - 1px),#F1F2EF calc(100% / 60 - 1px) calc(100% / 60));pointer-events:none}
.sweep{position:absolute;inset:0;background:var(--signal);transform-origin:left;animation:minute 60s linear infinite}
.fn{color:#B93A0B;padding:0 2px;font-family:'Geist Mono',ui-monospace,monospace}
.fn:hover{text-decoration:underline}
.src{color:#0A0C0F;text-decoration:underline;text-decoration-color:rgba(10,12,15,.3);text-underline-offset:3px;transition:text-decoration-color .2s}
.src:hover{text-decoration-color:var(--signal)}

.seg{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:transparent;color:#9AA3AD;font-size:14px;font-weight:500;cursor:pointer;transition:background-color .25s,color .25s}
.seg:hover{color:#ECEEF0}
.seg[aria-pressed="true"]{background:#ECEEF0;color:#0A0C0F}
.netmap .bath{fill:none;stroke:#3D4752;stroke-width:1;stroke-dasharray:2 5}
.netmap .land{fill:#13181E;stroke:#46515D;stroke-width:1.3}
.netmap .contour{fill:none;stroke:#ECEEF0;stroke-opacity:.06;stroke-width:1}
.netmap .lake{fill:#0B0E12;stroke:#46515D;stroke-width:1}
.netmap .river{fill:none;stroke:#2F3D4B;stroke-width:2;stroke-linecap:round}
.netmap .road{fill:none;stroke:#5A646E;stroke-opacity:.55;stroke-width:1;stroke-dasharray:6 4}
.netmap .hz{fill:var(--signal);fill-opacity:.08;stroke:var(--signal);stroke-opacity:.6;stroke-width:1.2;stroke-dasharray:4 5}
.netmap .hz-label{font-size:9px;letter-spacing:.28em;fill:var(--signal);fill-opacity:.9}
.netmap .lz{fill:#ECEEF0;fill-opacity:.05;stroke:#ECEEF0;stroke-opacity:.35;stroke-width:1;stroke-dasharray:3 5;transform:scale(0);transform-box:fill-box;transform-origin:center;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.netmap.is-remote .lz{transform:scale(1)}
.netmap .lk{fill:none;stroke:var(--signal);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1s cubic-bezier(.6,.05,.25,1)}
.netmap.is-remote .lk{stroke-dashoffset:0}
.netmap .lp{fill:none;stroke:#FFFFFF;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:.02 .98;opacity:0;animation:comet 2.6s linear infinite;transition:opacity .4s}
.netmap.is-remote .lp{opacity:1;transition-delay:1.1s}
.netmap .n-t{fill:#ECEEF0}
.netmap .n-r,.netmap .n-x{fill:#3B434C;transition:fill .5s}
.netmap.is-remote .n-r{fill:#ECEEF0;transition-delay:.7s}
.netmap .hosp{fill:#0A0C0F;stroke:#C9D1D9;stroke-width:1.5;transform-box:fill-box;transform-origin:center;transition:stroke .5s}
.netmap.is-remote .hosp{stroke:var(--signal);animation:pop .6s cubic-bezier(.2,.7,.2,1) both}

.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(236,238,240,.2);background:transparent;color:#C9D0D6;cursor:pointer;font-size:15px;font-weight:500;transition:background-color .25s,color .25s,border-color .25s}
.chip:hover{border-color:rgba(236,238,240,.6);color:#ECEEF0}
.chip[aria-pressed="true"]{background:#ECEEF0;color:#0A0C0F;border-color:#ECEEF0}
.dchips{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:480px){.dchips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.dchips .chip{justify-content:center;padding:0 4px;font-size:14px}}
.route{fill:none;stroke:var(--signal);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;transition:stroke-dashoffset 1.2s cubic-bezier(.6,.05,.25,1)}
.route-glow{fill:none;stroke:var(--signal);stroke-opacity:.22;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;transition:stroke-dashoffset 1.2s cubic-bezier(.6,.05,.25,1)}
.tflow{fill:none;stroke:#A4AEB8;stroke-opacity:.55;stroke-width:1.1;stroke-linecap:round;stroke-dasharray:1.6 12;animation:flow 3s linear infinite}
.tcomet{fill:none;stroke:#FFFFFF;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:.03 .97;animation:comet 1.6s cubic-bezier(.45,0,.25,1) infinite;transition:opacity .4s}
.playbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(236,238,240,.2);background:transparent;color:#C9D0D6;font-size:13px;font-weight:500;cursor:pointer;transition:border-color .25s,color .25s}
.playbtn:hover{border-color:rgba(236,238,240,.6);color:#ECEEF0}
.playbtn[aria-pressed="true"]{border-color:var(--signal);color:#ECEEF0}
.pseg{position:relative;flex:1;height:2px;border-radius:1px;background:rgba(236,238,240,.14);overflow:hidden}
.pseg::after{content:'';position:absolute;inset:0;background:var(--signal);transform:scaleX(0);transform-origin:left;transition:transform .4s}
.pseg.done::after,.pseg.now::after{transform:scaleX(1)}
.pseg.now.play::after{animation:fill 2.8s linear both}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:12px;width:100%;text-align:left;padding:18px 0;background:transparent;border:0;border-top:1px solid rgba(236,238,240,.12);cursor:pointer;color:#7D8792;transition:color .3s}
.step:first-child{border-top-color:transparent}
.step:hover{color:#C9D0D6}
.step .sn{padding-top:5px;font-size:12px;letter-spacing:.08em;color:inherit;transition:color .3s}
.step.on{color:#ECEEF0}
.step.on .sn{color:var(--signal)}
.step .sd{display:block;grid-column:2;font-size:15px;line-height:1.55;color:#9AA3AD;max-height:0;overflow:hidden;opacity:0;transition:max-height .5s ease,opacity .4s ease,margin .4s ease}
.step.on .sd{max-height:120px;opacity:1;margin-top:8px}
.fg .fgd{stroke-dasharray:1}
.fg:hover .fgd{animation:draw .9s cubic-bezier(.55,.05,.25,1) both}

.sim-wire{fill:none;stroke:var(--signal);stroke-width:3;stroke-linecap:round;stroke-dasharray:1000;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
.sim-glow{fill:none;stroke:var(--signal);stroke-opacity:.2;stroke-width:9;stroke-linecap:round;stroke-dasharray:1000;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
.sim-cath{fill:none;stroke:#C9D1D9;stroke-opacity:.26;stroke-width:10;stroke-linecap:round;stroke-dasharray:1000;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
.sim-tip{transition:transform .6s cubic-bezier(.4,0,.2,1)}
.shk-a{animation:shake .42s cubic-bezier(.36,.07,.19,.97) both}
.shk-b{animation:shake2 .42s cubic-bezier(.36,.07,.19,.97) both}
.wfl{fill:none;stroke:var(--signal);stroke-width:22;stroke-linecap:round;stroke-opacity:0}
.wfl.fl-a{animation:flash .8s ease-out both}
.wfl.fl-b{animation:flash2 .8s ease-out both}
.bloom-l{fill:none;stroke:var(--signal);stroke-width:30;stroke-linecap:round;opacity:0}
.sim.is-done .bloom-l{animation:contrast 2.6s ease-out forwards}
.simview{border-radius:16px}
.simview:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.ck{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7D8792;transition:color .3s}
.ck .ck-ring{fill:none;stroke:#4A535D;stroke-width:1.4;transition:stroke .3s,fill .3s}
.ck .ck-tick{fill:none;stroke:#0A0C0F;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .35s .1s}
.ck.ok{color:#ECEEF0}
.ck.ok .ck-ring{stroke:var(--signal);fill:var(--signal)}
.ck.ok .ck-tick{stroke-dashoffset:0}
.ctl{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:#1B2128;border:1px solid rgba(236,238,240,.12);color:#ECEEF0;font-size:15px;font-weight:500;cursor:pointer;transition:background-color .2s,border-color .2s,transform .1s}
.ctl:hover{background:#232A33;border-color:rgba(236,238,240,.3)}
.ctl:active{transform:translateY(1px)}
.ctl[disabled]{opacity:.35;cursor:not-allowed}
.ctl-primary{background:var(--signal);color:#0A0C0F;border-color:transparent}
.ctl-primary:hover{background:#ECEEF0}
@media (hover:none){.kbd-hint{display:none}}

.spot{position:relative;isolation:isolate}
.spot::before{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(236,238,240,.075),transparent 50%);opacity:0;transition:opacity .4s;pointer-events:none;z-index:-1}
.spot:hover::before{opacity:1}
.flow{display:grid;grid-template-columns:minmax(0,1fr) 112px minmax(0,1fr) 112px minmax(0,1fr);align-items:stretch}
.conn{display:flex;align-items:center;justify-content:center}
.conn-in{width:100%;padding:0 12px;display:flex;flex-direction:column;gap:10px}
.lane-l{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7D8792;text-align:center}
.lane{position:relative;height:2px;background:rgba(236,238,240,.14)}
.lane span{position:absolute;top:-2px;left:30%;width:6px;height:6px;border-radius:50%;background:var(--signal);animation:lane 2.4s linear infinite}
.lane span + span{left:66%}
.lane.back span{background:#C9D1D9;animation-name:laneb}
@media (max-width:980px){.flow{grid-template-columns:minmax(0,1fr)}.conn{height:96px}.conn-in{width:96px;transform:rotate(90deg)}.lane-l{display:none}}
.io{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:6px 14px;margin-top:auto;padding-top:16px;border-top:1px dashed rgba(236,238,240,.14);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7D8792}
.io b{font-weight:500;color:#C9D0D6}
.io svg{display:block}
.g-push{animation:push 3s cubic-bezier(.6,0,.4,1) infinite}
.g-spin{transform-box:view-box;transform-origin:140px 60px;animation:spin 3.6s cubic-bezier(.6,0,.4,1) infinite}
.g-a{animation:push 2.8s cubic-bezier(.6,0,.4,1) infinite}
.g-b{animation:push 2.8s cubic-bezier(.6,0,.4,1) -1.4s infinite}

.stmt{view-timeline-name:--stmt}
.hline{position:relative;flex:1;height:1px;margin:0 -32px 0 16px;background:rgba(10,12,15,.16)}
.hline span{position:absolute;top:-2.5px;left:0;width:6px;height:6px;border-radius:50%;background:var(--signal);animation:travel 3.2s cubic-bezier(.5,0,.5,1) infinite}
@media (max-width:1009px){.hline{display:none}}
.hz-g .rp{transform-box:fill-box;transform-origin:center;opacity:0}
.hz-card:hover .hz-g .rp{animation:ripple 1.6s ease-out infinite}
.hz-card:hover .hz-g .rp2{animation-delay:.5s}

.aud{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px 20px;padding:24px 0;transition:padding .35s cubic-bezier(.2,.7,.2,1)}
.aud::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:rgba(236,238,240,.14)}
.aud::after{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:var(--signal);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.aud:hover{padding-left:12px}
.aud:hover::after{transform:scaleX(1)}
.aud .arw{color:#7D8792;transition:transform .35s cubic-bezier(.2,.7,.2,1),color .25s}
.aud:hover .arw{transform:translateX(4px);color:var(--signal)}
.flink{color:#9AA3AD;transition:color .2s}
.flink:hover{color:#ECEEF0}
.totop{display:inline-flex;align-items:center;gap:8px;color:#9AA3AD;transition:color .2s}
.totop:hover{color:#ECEEF0}
.totop svg{transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.totop:hover svg{transform:translateY(-3px)}

@supports (animation-timeline: view()){

}

<section id="problem" style="background: #F1F2EF; color: #0A0C0F; padding: clamp(80px, 8vw, 120px) 0">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 clamp(20px, 4.5vw, 56px)">
<div class="mono rv" style="display: flex; align-items: center; gap: 14px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #545B63"><span><span style="color: #B93A0B">01</span><span style="opacity: .55"> / 05</span></span><span class="chap-rule" style="width: 64px; height: 1px; background: var(--signal); transform-origin: left"></span><span>The access gap</span></div>
<div style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 32px 72px; align-items: end">
<h2 class="rv" style="font-size: clamp(36px, 4.9vw, 72px); font-weight: 500; line-height: 1; letter-spacing: -0.04em; text-wrap: balance">Where you live can decide how you’re treated.</h2>
<div class="rv" style="display: flex; flex-direction: column; gap: 18px; max-width: 560px; font-size: clamp(17px, 1.35vw, 19px); line-height: 1.6; color: #545B63; text-wrap: pretty">
<p>Some of medicine’s most effective treatments happen inside the blood vessels, through a puncture just a few millimeters wide. They can stop a stroke, halt internal bleeding or reopen a blocked artery&nbsp;— often without open surgery.</p>
<p>But they rely on a small number of highly specialized physicians and dedicated imaging rooms, concentrated in large hospitals. For many patients, the nearest one is hours away. For a condition like stroke, those hours matter.</p>
</div>

<div class="mono rv" style="margin-top: 88px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #545B63">Case in point: stroke</div>
<div class="tri" style="margin-top: 20px; gap: 40px 32px">
<div class="rv" style="border-top: 1px solid rgba(10,12,15,.16); padding-top: 24px; display: flex; flex-direction: column; gap: 18px">

<div class="mapcap" aria-live="polite">
<p class="{{ capToday }}">Specialist centers can only treat the patients who reach them in time. Everyone outside the circle travels, waits or goes without.</p>
<p class="{{ capRemote }}">Remote intervention could let a specialist treat patients at their own local hospital&nbsp;— even across the water&nbsp;— extending expert care without moving the expert.</p>

<h2 class="rv" style="font-size: clamp(36px, 4.9vw, 72px); font-weight: 500; line-height: 1; letter-spacing: -0.04em; text-wrap: balance">One small opening. A&nbsp;route to almost anywhere.</h2>
<p class="rv" style="max-width: 560px; font-size: clamp(17px, 1.35vw, 19px); line-height: 1.6; color: #AEB6BF; text-wrap: pretty">Your arteries form one continuous network that reaches every organ. Endovascular procedures use it as a road: from a small puncture at the groin or wrist, a physician steers thin instruments to exactly where treatment is needed&nbsp;— guided by live <span class="nw">X-ray</span>.</p>

</sc-for>
</div>
<div style="margin-top: 28px; padding: 24px 0 32px; border-top: 1px solid rgba(236,238,240,.12)">
<div class="mono" style="font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--signal)">{{ destTag }}</div>
<p aria-live="polite" style="margin-top: 12px; max-width: 560px; font-size: clamp(22px, 2vw, 28px); line-height: 1.25; letter-spacing: -0.02em; text-wrap: pretty">{{ destText }}</p>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px">
<div class="mono" style="font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #9AA3AD">The procedure, step by step</div>
<button type="button" class="playbtn" aria-pressed="{{ playing }}" onClick="{{ togglePlay }}">
<sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" style="fill: currentColor"><rect x="2" y="1.5" width="2.6" height="9" rx="1"></rect><rect x="7.4" y="1.5" width="2.6" height="9" rx="1"></rect></svg></sc-if>
<sc-if value="{{ notPlaying }}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" style="fill: currentColor"><path d="M3 1.5 L10.5 6 L3 10.5 Z"></path></svg></sc-if>
{{ playLabel }}</button>
</div>
<div aria-hidden="true" style="display: flex; gap: 6px; margin-bottom: 6px">
<sc-for list="{{ segs }}" as="sg" hint-placeholder-count="4"><span class="{{ sg.cls }}"></span></sc-for>
</div>
<div style="display: flex; flex-direction: column">

<button type="button" class="{{ st.cls }}" aria-pressed="{{ st.current }}" onClick="{{ st.pick }}"><span class="mono sn">{{ st.n }}</span><span style="font-size: 21px; font-weight: 500; letter-spacing: -0.015em">{{ st.title }}</span><span class="sd">{{ st.text }}</span></button>
</sc-for>
</div>
<div style="margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center">

<div style="max-width: 1280px; margin: 0 auto; padding: 0 clamp(20px, 4.5vw, 56px)">
<div class="mono rv" style="display: flex; align-items: center; gap: 14px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #545B63"><span><span style="color: #B93A0B">03</span><span style="opacity: .55"> / 05</span></span><span class="chap-rule" style="width: 64px; height: 1px; background: var(--signal); transform-origin: left"></span><span>Why expertise is rare</span></div>
<div style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 40px 72px">
<div class="rv" style="display: flex; flex-direction: column; gap: 28px">
<h2 style="font-size: clamp(36px, 4.9vw, 72px); font-weight: 500; line-height: 1; letter-spacing: -0.04em; text-wrap: balance">The instruments are thin. The&nbsp;skill is rare.</h2>
<p style="max-width: 540px; font-size: clamp(17px, 1.35vw, 19px); line-height: 1.6; color: #545B63; text-wrap: pretty">Steering a guidewire is a craft of millimeters. The physician feels for resistance through their fingertips, reads a grey <span class="nw">X-ray</span> image, and turns every small push and twist into motion deep inside the body.</p>
</div>
<div class="rv" style="display: flex; flex-direction: column; align-self: end">
<div style="display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 6px 12px; padding: 20px 0; border-top: 1px solid rgba(10,12,15,.14)">
<span class="mono" style="font-size: 12px; color: #B93A0B; padding-top: 4px">A</span>
<h3 style="font-size: 20px; font-weight: 500; letter-spacing: -0.015em">Years of training</h3>
<p style="grid-column: 2; font-size: 15px; line-height: 1.55; color: #545B63">Interventional specialists train for years beyond medical school to master navigation by <span class="nw">X-ray</span>.</p>
</div>
<div style="display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 6px 12px; padding: 20px 0; border-top: 1px solid rgba(10,12,15,.14)">
<span class="mono" style="font-size: 12px; color: #B93A0B; padding-top: 4px">B</span>
<h3 style="font-size: 20px; font-weight: 500; letter-spacing: -0.015em">Specialized rooms and teams</h3>
<p style="grid-column: 2; font-size: 15px; line-height: 1.55; color: #545B63">Procedures need an angiography suite, a trained team and <span class="nw">around-the-clock</span> availability&nbsp;— so expertise gathers in a few large centers.</p>
</div>
<div style="display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 6px 12px; padding: 20px 0; border-top: 1px solid rgba(10,12,15,.14); border-bottom: 1px solid rgba(10,12,15,.14)">
<span class="mono" style="font-size: 12px; color: #B93A0B; padding-top: 4px">C</span>
<h3 style="font-size: 20px; font-weight: 500; letter-spacing: -0.015em">A physical toll</h3>
<p style="grid-column: 2; font-size: 15px; line-height: 1.55; color: #545B63">Operators work beside the <span class="nw">X-ray</span> source, often in heavy lead protection, for hours at a time.</p>
</div>
</div>
</div>

<script src="/assets/hito-runtime.js"></script>
<script>
(function () {
var DCLogic = window.DCLogic;
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: false, map: 'today', dest: 'brain', step: 1, playing: false, pos: 0, up: true, branch: null, moves: 0, bump: 0, blocked: false };
    this.timer = null;
    this.toggleMenu = () => this.setState({ menu: !this.state.menu });
    this.closeMenu = () => this.setState({ menu: false });
    this.setToday = () => this.setState({ map: 'today' });
    this.setRemote = () => this.setState({ map: 'remote' });
    this.spot = (e) => {
      const el = e && e.currentTarget;
      if (!el || !el.getBoundingClientRect || !el.style) return;
      const r = el.getBoundingClientRect();
      el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      el.style.setProperty('--my', (e.clientY - r.top) + 'px');
    };
    this.stopPlay = () => { if (this.timer) { clearInterval(this.timer); this.timer = null; } };
    this.togglePlay = () => {
      if (this.state.playing) { this.stopPlay(); this.setState({ playing: false }); return; }
      this.stopPlay();
      this.setState({ playing: true, step: 0 });
      this.timer = setInterval(() => {
        const n = this.state.step + 1;
        if (n > 3) { this.stopPlay(); this.setState({ playing: false }); return; }
        this.setState({ step: n });
      }, 2800);
    };
    this.nextStep = () => { this.stopPlay(); this.setState({ playing: false, step: (this.state.step + 1) % 4 }); };
    this.pickStep = (i) => () => { this.stopPlay(); this.setState({ playing: false, step: i }); };
    this.pickDest = (id) => () => this.setState({ dest: id });
    this.rotate = () => { const s = this.state; this.setState({ up: !s.up, moves: s.moves + 1, blocked: false }); };
    this.advance = () => {
      const s = this.state;
      if (s.branch === 'down' && s.pos === 6) return;
      if (s.branch === 'up' && s.pos >= 5) { this.setState({ bump: s.bump + 1, blocked: true, moves: s.moves + 1 }); return; }
      if (s.pos === 3) { this.setState({ pos: 4, branch: s.up ? 'up' : 'down', moves: s.moves + 1, blocked: false }); return; }
      this.setState({ pos: s.pos + 1, moves: s.moves + 1, blocked: false });
    };
    this.retract = () => {
      const s = this.state;
      if (s.pos === 0) return;
      const pos = s.pos - 1;
      this.setState({ pos: pos, branch: pos <= 3 ? null : s.branch, moves: s.moves + 1, blocked: false });
    };
    this.reset = () => this.setState({ pos: 0, up: true, branch: null, moves: 0, bump: 0, blocked: false });
    this.simKey = (e) => {
      const k = e && e.key;
      if (k === 'ArrowRight' || k === 'ArrowUp') { e.preventDefault(); this.advance(); }
      else if (k === 'ArrowLeft' || k === 'ArrowDown') { e.preventDefault(); this.retract(); }
      else if (k === 'r' || k === 'R') { e.preventDefault(); this.rotate(); }
    };
  }

  componentWillUnmount() { this.stopPlay(); }

  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? '#FF5B1F';
    const motion = this.props.motion ?? true;

    const DESTS = [
      { id: 'brain', name: 'Brain', tag: 'Stroke · Aneurysm', text: 'Remove a clot that is causing a stroke, or seal off a weak, bulging vessel.' },
      { id: 'heart', name: 'Heart', tag: 'Heart attack · Blocked arteries', text: 'Open a blocked coronary artery to restore blood flow to the heart muscle.' },
      { id: 'liver', name: 'Liver', tag: 'Liver tumors', text: 'Deliver treatment directly into the vessels that feed a tumor.' },
      { id: 'pelvis', name: 'Pelvis', tag: 'Internal bleeding', text: 'Stop severe internal bleeding, such as after trauma or childbirth.' },
      { id: 'leg', name: 'Leg', tag: 'Blocked arteries', text: 'Reopen a narrowed artery to restore blood flow to the leg.' }
    ];
    const STEPS = [
      { title: 'Access', text: 'A small puncture, usually at the groin or wrist, opens a doorway into an artery. No large incision.' },
      { title: 'Navigate', text: 'Watching live X-ray, the physician pushes, pulls and twists a guidewire through the branching vessels, with a catheter following.' },
      { title: 'Treat', text: 'At the destination, the catheter delivers the therapy — removing a clot, placing a stent or sealing a bleeding vessel.' },
      { title: 'Withdraw', text: 'The instruments come out the way they went in, leaving only the small puncture to heal.' }
    ];
    const stepOff = [0.95, 0.3, 0, 1][s.step];
    const off = {}, ring = {}, lbl = {}, comet = {};
    DESTS.forEach((d) => {
      const on = d.id === s.dest;
      off[d.id] = on ? stepOff : 1;
      ring[d.id] = on && s.step === 2 ? 1 : 0;
      comet[d.id] = on && s.step === 2 ? 1 : 0;
      lbl[d.id] = on ? '#ECEEF0' : '#7D8792';
    });
    const dest = DESTS.find((d) => d.id === s.dest) || DESTS[0];
    const dests = DESTS.map((d) => ({ name: d.name, pressed: d.id === s.dest, pick: this.pickDest(d.id) }));
    const steps = STEPS.map((t, i) => ({
      n: '0' + (i + 1), title: t.title, text: t.text,
      cls: i === s.step ? 'step on' : 'step', current: i === s.step,
      pick: this.pickStep(i)
    }));
    const segs = STEPS.map((t, i) => ({ cls: i < s.step ? 'pseg done' : (i === s.step ? (s.playing ? 'pseg now play' : 'pseg now') : 'pseg') }));

    const L = 752.3;
    const SS = [120, 200, 280, 340, 420, 505, 590];
    const P = {
      main: [[80, 160, 0], [160, 160, 0], [240, 160, 0], [300, 160, 0]],
      up: [[377.1, 140.7, -21.6], [456.6, 110.6, -18.1], [538.8, 89.2, -11.3]],
      down: [[377.1, 179.3, 21.6], [456.6, 209.4, 18.1], [538.8, 230.8, 11.3]]
    };
    const toOff = (len) => (1000 - Math.max(0, len) * 1000 / L).toFixed(1);
    const sNow = SS[s.pos];
    const wNow = toOff(sNow), cNow = toOff(sNow - 70);
    const wJ = toOff(Math.min(sNow, 340)), cJ = toOff(Math.min(sNow - 70, 340));
    const wire = { up: s.branch === 'down' ? wJ : wNow, down: s.branch === 'up' ? wJ : wNow };
    const cath = { up: s.branch === 'down' ? cJ : cNow, down: s.branch === 'up' ? cJ : cNow };
    const pt = s.pos <= 3 ? P.main[s.pos] : P[s.branch][s.pos - 4];
    const tipT = 'translate(' + pt[0] + 'px, ' + pt[1] + 'px) rotate(' + pt[2] + 'deg) scaleY(' + (s.up ? 1 : -1) + ')';
    const done = s.branch === 'down' && s.pos === 6;
    let msg = 'Goal: reach the target in the lower branch. Advance to the fork, then rotate the tip to choose your path.';
    if (done) msg = 'Target reached in ' + s.moves + ' moves — the minimum is 7. Push, pull, twist: that’s the core skill. Now imagine doing it with the same precision from another city.';
    else if (s.blocked) msg = 'Resistance — the vessel narrows and the wire won’t pass. This branch never reaches the target: pull back to the fork, rotate the tip and try again.';
    else if (s.branch === 'up') msg = 'You’ve entered the upper branch. The target is in the lower one.';
    else if (s.branch === 'down') msg = 'Lower branch. Keep advancing toward the target.';
    else if (s.pos === 3) msg = 'You’re at the fork. The wire follows its tip — rotate to aim it, then advance.';
    let posLabel = 'Main vessel';
    if (done) posLabel = 'Target';
    else if (s.branch === 'up') posLabel = 'Upper branch';
    else if (s.branch === 'down') posLabel = 'Lower branch';
    else if (s.pos === 3) posLabel = 'At the fork';
    const reach = s.map === 'remote' ? 47 : 14;

    return {
      accent: accent,
      siteCls: motion ? 'site' : 'site still',
      menuOpen: s.menu, menuLabel: s.menu ? 'Close menu' : 'Open menu',
      toggleMenu: this.toggleMenu, closeMenu: this.closeMenu,
      spot: this.spot,
      mapCls: s.map === 'remote' ? 'is-remote' : 'is-today',
      mapToday: s.map === 'today', mapRemote: s.map === 'remote',
      setToday: this.setToday, setRemote: this.setRemote,
      capToday: s.map === 'remote' ? 'off' : '', capRemote: s.map === 'remote' ? '' : 'off',
      reach: reach, reachPct: (reach / 74 * 100).toFixed(1) + '%',
      dests: dests, destName: dest.name, destTag: dest.tag, destText: dest.text,
      steps: steps, segs: segs, off: off, ring: ring, lbl: lbl, comet: comet,
      accessRing: s.step === 0 ? 1 : 0,
      playing: s.playing, notPlaying: !s.playing, playLabel: s.playing ? 'Pause' : 'Play the procedure',
      togglePlay: this.togglePlay,
      nextStep: this.nextStep, nextLabel: s.step === 3 ? 'Start again' : 'Next step',
      wire: wire, cath: cath, tipT: tipT,
      simCls: done ? 'is-done' : '',
      shkCls: s.bump === 0 ? '' : (s.bump % 2 ? 'shk-a' : 'shk-b'),
      flCls: s.bump === 0 ? '' : (s.bump % 2 ? 'fl-a' : 'fl-b'),
      ck: { fork: s.pos >= 3 ? 'ck ok' : 'ck', aim: s.branch === 'down' ? 'ck ok' : 'ck', target: done ? 'ck ok' : 'ck' },
      moves: s.moves,
      tipLabel: s.up ? 'Angled up' : 'Angled down', posLabel: posLabel,
      msg: msg, msgColor: done ? 'var(--signal)' : (s.blocked ? '#ECEEF0' : '#C9D0D6'),
      targetFill: done ? 'var(--signal)' : '#0A0C0F',
      advDisabled: done,
      retDisabled: s.pos === 0,
      rotate: this.rotate, advance: this.advance, retract: this.retract, reset: this.reset,
      simKey: this.simKey
    };
  }
}
window.HitoApp.mount(Component, {"accent": "#FF5B1F", "motion": true});
})();
</script>
